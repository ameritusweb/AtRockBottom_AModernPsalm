main{flex:1;display:flex;flex-direction:column;min-height:0}

canvas{display:block;width:100%;height:100%}

#cur{font-size:clamp(22px,4vw,40px);font-weight:600;line-height:1.25;min-height:1.3em}
#cur .w{color:var(--muted);transition:color .08s,text-shadow .08s;margin:0 .18em}
#cur .w.past{color:var(--ink)}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,18,32,.72);backdrop-filter:blur(2px)}

<script>

$('bar').querySelector('.gen').style.left=(D.recEnd/D.end*100)+'%';

for(const b of breaks){const d=document.createElement('div'); d.className='brk'; d.style.left=(b.s/D.end*100)+'%'; d.style.width=((b.e-b.s)/D.end*100)+'%'; $('bar').insertBefore(d,$('bar').querySelector('.fill'))}

$('sync').value=userSync;
$('sync').addEventListener('change',()=>{userSync=parseInt($('sync').value,10)||0; try{localStorage.setItem('arb-sync',String(userSync))}catch(e){}});
function latency(){ if(!ac) return 0; return (ac.outputLatency||0)+(ac.baseLatency||0) }
function vnow(){ return now()-latency()-userSync/1000 }   // what the listener is hearing right now
// ---------- audio ----------
function ensureAudio(){
  if(ac) return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
  melGain=ac.createGain(); melGain.connect(master);
  chGain=ac.createGain(); chGain.connect(master);
  saxGain=ac.createGain(); saxGain.connect(master);
  applyToggles();
}
function applyToggles(){
  if(!ac) return;
  melGain.gain.value=$('tMel').checked?1:0;
  chGain.gain.value=$('tChords').checked?1:0;
  saxGain.gain.value=$('tSax').checked?1:0;
}
['tMel','tChords','tSax'].forEach(id=>$(id).addEventListener('change',applyToggles));
const f=m=>440*Math.pow(2,(m-69)/12);
// simple additive piano: decaying harmonics with a soft hammer attack
function piano(p,when,dur,vel,dest){
  const g=ac.createGain(); g.connect(dest);
  const base=f(p), harm=[[1,1],[2,.55],[3,.28],[4,.14],[5,.07]];

function playNote(n,when){ piano(n.p,when,n.d,.5,melGain) }
function playChord(c,when){
  const spread=.02;

}
function scheduler(){
  const t=now(), horizon=t+.8;

function seekIndexes(t){schedIdx=notes.findIndex(n=>n.s>=t); if(schedIdx<0) schedIdx=notes.length; saxIdx=sax.findIndex(n=>n.s>=t); if(saxIdx<0) saxIdx=sax.length; chordIdx=chords.findIndex(c=>c.s+c.d>t); if(chordIdx<0) chordIdx=chords.length}
async function play(){
  ensureAudio(); if(ac.state==='suspended') await ac.resume();
  master.gain.cancelScheduledValues(0); master.gain.setValueAtTime(.9,ac.currentTime);   // undo any fade from a previous run

}
function pause(){ if(!playing) return; offset=now(); playing=false; clearInterval(timer); $('play').textContent='Play'}
function seek(t){const was=playing; if(was) pause(); offset=Math.max(0,Math.min(D.end,t)); if(was) play()}
$('play').onclick=()=>playing?pause():play();

let W=0,H=0,dpr=1,keyX=[],whiteW=0,KH=0;
function layout(){
  dpr=window.devicePixelRatio||1; const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  let whites=0; for(let m=LO;m<=HI;m++) if(!BLACK.has(m%12)) whites++;

}
window.addEventListener('resize',layout);
function roundRect(x,y,w,h,tl,tr,br,bl){ if(tr===undefined){tr=br=bl=tl} if(h<=0||w<=0) return; ctx.beginPath(); ctx.moveTo(x+tl,y); ctx.lineTo(x+w-tr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+tr); ctx.lineTo(x+w,y+h-br); ctx.quadraticCurveTo(x+w,y+h,x+w-br,y+h); ctx.lineTo(x+bl,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-bl); ctx.lineTo(x,y+tl); ctx.quadraticCurveTo(x,y,x+tl,y); ctx.fill() }
function draw(){
  const t=vnow(); const kb=H-KH, pps=kb/LEAD;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#1b2238'; ctx.lineWidth=1;
  for(let m=LO;m<=HI;m++) if(!BLACK.has(m%12)){ctx.beginPath(); ctx.moveTo(keyX[m].x+.5,0); ctx.lineTo(keyX[m].x+.5,kb); ctx.stroke()}
  const active=new Map();   // key -> which voice is sounding on it (declared before any drawing uses it)
  // chords as soft bands
  for(const c of chords){
    const y1=kb-(c.s+c.d-t)*pps, y2=kb-(c.s-t)*pps; if(y2<0||y1>kb) continue;
    const cp=c.p.filter(p=>p>=LO&&p<=HI); if(!cp.length) continue;
    const lo=Math.min(...cp), hi=Math.max(...cp);
    const x0=keyX[lo].x, x1=keyX[hi].x+keyX[hi].w, ya=Math.max(0,y1), yb=Math.min(kb,y2);
    ctx.fillStyle='rgba(77,104,201,.10)'; ctx.fillRect(x0,ya,x1-x0,yb-ya);
    const on=c.s<=t&&t<c.s+c.d;
    const held=c.hold||c.p;
    for(const p of held){ if(p<LO||p>HI) continue; const k=keyX[p]; ctx.fillStyle=on?'rgba(77,104,201,.55)':'rgba(77,104,201,.28)'; roundRect(k.x+2,ya+2,k.w-4,yb-ya-4,4)}
    if(c.pat){ const e8=c.d/c.pat.length; c.pat.forEach((p,i)=>{ if(p<LO||p>HI) return; const s=c.s+i*e8, ya2=kb-(s+e8*.9-t)*pps, yb2=kb-(s-t)*pps; if(yb2<0||ya2>kb) return; const k=keyX[p]; const pon=s<=t&&t<s+e8*.9; if(pon) active.set(p,'chord'); ctx.fillStyle=pon?'rgba(120,150,255,.9)':'rgba(77,104,201,.6)'; roundRect(k.x+(k.black?3:6),Math.max(0,ya2),k.w-(k.black?6:12),Math.min(kb,yb2)-Math.max(0,ya2),3) }) }
    if(y2>16&&y2<kb+20){ctx.fillStyle='rgba(170,185,240,.7)'; ctx.font='12px Segoe UI,sans-serif'; ctx.fillText(c.fade?c.name+'  (hold, fade out)':c.name,x0+6,Math.min(kb-6,y2-6))}
  }
  // melody bars
  for(const n of notes){
    const y1=kb-(n.s+n.d-t)*pps, y2=kb-(n.s-t)*pps; if(y2<0||y1>kb) continue;
    if(n.p<LO||n.p>HI) continue; const k=keyX[n.p]; const on=n.s<=t&&t<n.s+n.d; if(on) active.set(n.p,n.src);
    const col=n.src==='gen'?'#5fd3c7':n.src==='int'?'#c48cff':n.src==='brg'?'#ffd97a':'#f2b544';
    ctx.shadowColor=on?col:'transparent'; ctx.shadowBlur=on?18:0; ctx.fillStyle=col; ctx.globalAlpha=on?1:.85;
    roundRect(k.x+(k.black?2:5),Math.max(0,y1),k.w-(k.black?4:10),Math.min(kb,y2)-Math.max(0,y1),4);
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  }
  // sax bars, own colour, slightly narrower
  for(const n of sax){
    const y1=kb-(n.s+n.d-t)*pps, y2=kb-(n.s-t)*pps; if(y2<0||y1>kb||n.p<LO||n.p>HI) continue;
    const k=keyX[n.p]; const on=n.s<=t&&t<n.s+n.d; if(on) active.set(n.p,'sax');
    ctx.shadowColor=on?'#f0706a':'transparent'; ctx.shadowBlur=on?18:0; ctx.fillStyle='#f0706a'; ctx.globalAlpha=on?1:.8;
    roundRect(k.x+(k.black?4:8),Math.max(0,y1),k.w-(k.black?8:16),Math.min(kb,y2)-Math.max(0,y1),4);
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  }
  // keyboard
  ctx.fillStyle='#0a0d18'; ctx.fillRect(0,kb,W,KH);
  for(let m=LO;m<=HI;m++) if(!BLACK.has(m%12)){const k=keyX[m]; ctx.fillStyle=active.has(m)?(active.get(m)==='gen'?'#a9efe8':active.get(m)==='sax'?'#ffc3bf':active.get(m)==='int'?'#e6d2ff':active.get(m)==='brg'?'#fff1c2':'#ffe1a0'):'#f4f4f8'; roundRect(k.x+1,kb,k.w-2,KH-2,0,0,5,5); if(m%12===3){ctx.fillStyle='#8c96b4'; ctx.font='11px Segoe UI,sans-serif'; ctx.fillText('Eb'+(Math.floor(m/12)-1),k.x+5,H-8)}}
  for(let m=LO;m<=HI;m++) if(BLACK.has(m%12)){const k=keyX[m]; ctx.fillStyle=active.has(m)?(active.get(m)==='gen'?'#3fb3a7':active.get(m)==='sax'?'#d9534e':active.get(m)==='int'?'#9b6ad9':active.get(m)==='brg'?'#d9b24a':'#d9952a'):'#1a1a24'; roundRect(k.x,kb,k.w,KH*.62,0,0,4,4)}
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(0,kb-1,W,2);
  const gen=t>=D.recEnd;
  $('tcur').textContent=fmt(t); $('bar').querySelector('.fill').style.width=(t/D.end*100)+'%';
  captions(t);
  requestAnimationFrame(draw);
}
let lastLine=-2, spans=[];
const lineWords=[]; for(const w of words){(lineWords[w.line]=lineWords[w.line]||[]).push(w)}
function captions(t){
  const br=breaks.find(b=>b.s-.3<=t&&t<b.e-.3);
  if(br){ if(lastLine!=='break'){ lastLine='break'; spans=[]; const cur=$('cur'); cur.innerHTML=''; cur.className='solo'; const s=document.createElement('span'); s.className='w on'; s.textContent='♫ '+br.label+' ♫'; cur.appendChild(s); let ni=0; while(ni<lineWords.length&&(!lineWords[ni]||lineWords[ni][0].s<br.e)) ni++; $('next').textContent=ni<lineWords.length?D.lines[ni]:'' } return }
  let li=-1; for(let i=0;i<lineWords.length;i++){const lw=lineWords[i]; if(!lw) continue; if(lw[0].s-.4<=t) li=i; else break}
  if(li!==lastLine){
    lastLine=li; const cur=$('cur'); cur.innerHTML=''; spans=[];
    if(li>=0) for(const w of lineWords[li]){const s=document.createElement('span'); s.className='w'; s.textContent=w.w; cur.appendChild(s); spans.push([s,w])}
    let ni=li+1; while(ni<lineWords.length&&!lineWords[ni]) ni++;
    $('next').textContent=ni<lineWords.length?D.lines[ni]:'';
    cur.className=li<0?'':lineWords[li][0].src==='int'?'int':lineWords[li][0].src==='brg'?'brg':(lineWords[li][0].s>=D.recEnd?'gen':'');
  }
  for(const [s,w] of spans){ s.className='w'+(w.e<t?' past':(w.s<=t?' on':'')) }
}
layout(); draw();
</script>
